name: CI

on:
  push:

jobs:
  secrets:
    name: Check for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-secrets.sh

  desktop:
    name: Desktop build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-desktop-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Install libcurl, SDL2 and ffmpeg (the desktop build's HTTPS, window and sound)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libsdl2-dev ffmpeg
      - name: Run tests
        run: pio test -e desktop
      - name: Build
        run: pio run -e desktop
      - name: Start the desktop box briefly
        # There's no screen or sound card here, so SDL pretends to have them.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: .pio/build/desktop/program --data "$RUNNER_TEMP/box" --ticks 200

  core2:
    name: Core2 firmware compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-core2-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio run -e core2
      - name: Package a practice release (not published)
        run: scripts/make-release.sh .pio/build/core2/firmware.bin "$RUNNER_TEMP/release" --notes "CI check"
