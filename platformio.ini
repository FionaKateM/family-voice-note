; Family Voice Box: two builds from one codebase.
;
;   pio run  -e desktop      build the laptop version
;   pio test -e desktop      run the unit tests
;   pio run  -e core2        build the real device firmware
;
; Code layout:
;   lib/hal                 hardware interfaces (no implementation)
;   lib/app                 the box's logic. Plain C++, no Arduino, so it runs anywhere
;   lib/telegram            Telegram Bot API client, built on the Network interface
;   lib/platform_desktop    laptop versions of the interfaces
;   lib/platform_core2      Core2 versions of the interfaces (M5Unified)
;   lib/fakes               in-memory versions used by tests
;   src/                    one small main file per build

[platformio]
default_envs = desktop

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DFVB_CORE2
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified@0.2.2
    ; Not used by the device yet, but listed so the Core2 build proves it compiles.
    telegram
lib_ignore =
    platform_desktop
    fakes
build_src_filter = +<core2_main.cpp>

[env:desktop]
platform = native
build_flags =
    ${common.build_flags}
    -DFVB_DESKTOP
    -lcurl
lib_deps =
    ${common.lib_deps}
lib_ignore =
    platform_core2
build_src_filter = +<desktop_main.cpp>
test_framework = unity
