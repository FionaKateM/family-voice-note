; Family Voice Box: two builds from one codebase.
;
;   pio run  -e desktop      build the laptop version
;   pio test -e desktop      run the unit tests
;   pio run  -e core2        build the real device firmware
;   pio run  -e core2-check  build the hardware check for the device
;                            (add -t upload to install either one)
;
; Code layout:
;   lib/hal                 hardware interfaces (no implementation)
;   lib/app                 the box's logic. Plain C++, no Arduino, so it runs anywhere
;   lib/telegram            Telegram Bot API client, built on the Network interface
;   lib/platform_desktop    laptop versions of the interfaces
;   lib/platform_core2      Core2 versions of the interfaces (M5Unified)
;   lib/fakes               in-memory versions used by tests
;   src/                    one small main file per build

[platformio]
default_envs = desktop

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:core2]
platform = espressif32@6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -DFVB_CORE2
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified@0.2.2
    adafruit/Adafruit NeoPixel@1.12.3
    telegram
lib_ignore =
    platform_desktop
    fakes
build_src_filter = +<core2_main.cpp>

; The hardware check (ticket 2.1): a list on screen of each part of the device
; and whether it works. See src/core2_check.cpp.
[env:core2-check]
extends = env:core2
build_src_filter = +<core2_check.cpp>

[env:desktop]
platform = native
build_flags =
    ${common.build_flags}
    -DFVB_DESKTOP
    -lcurl
    -pthread
    !sh scripts/sdl-flags.sh
lib_deps =
    ${common.lib_deps}
; Look through every source file of each library to find what it needs. The
; default only follows the headers a test includes, so a test that reaches
; lib/app through its storage headers never saw that lib/app/bot needs
; lib/telegram, and failed to compile.
lib_ldf_mode = deep
lib_ignore =
    platform_core2
build_src_filter = +<desktop_main.cpp>
test_framework = unity
